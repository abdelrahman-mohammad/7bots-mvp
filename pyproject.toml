[project]
name = "7bots-mvp"
version = "0.1.0"
description = "Multi-agent platform that extracts a traceable ArchiMate As-Is model from legacy system evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "black>=24.10",
    "poethepoet>=0.30",
    "pre-commit>=4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "S", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.poe.tasks.lint]
sequence = ["ruff check .", "black --check ."]
default_item_type = "cmd"

[tool.poe.tasks.format]
sequence = ["ruff check --fix .", "black ."]
default_item_type = "cmd"
