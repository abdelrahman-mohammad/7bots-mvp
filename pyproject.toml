[project]
name = "7bots-mvp"
version = "0.1.0"
description = "Multi-agent platform that extracts a traceable ArchiMate As-Is model from legacy system evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "deepagents>=0.5.9",
    "langchain>=1.0,<2.0",
    "langchain-anthropic",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "black>=24.10",
    "poethepoet>=0.30",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/migrations/versions"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
force-exclude = "backend/migrations/versions"

[tool.poe.tasks]
db-check = "python -m backend.db"
test = "pytest"
trace-check = "python -m agents.trace_check"
skill-test = "python -m agents.skill_smoke_test"
subagent-check = "python -m agents.subagent_check"

[tool.poe.tasks.lint]
sequence = ["ruff check .", "black --check ."]
default_item_type = "cmd"

[tool.poe.tasks.format]
sequence = ["ruff check --fix .", "black ."]
default_item_type = "cmd"
